<style>/* Undo: delete from the ABJ B2H marker to /ABJ B2H (and the b2v figure / b2h section / lng line if added) and publish. */
#kc .b2v{position:relative;overflow:hidden;background:#0E1B1A}
#kc .b2v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#kc .b2c{position:absolute;left:0;right:0;bottom:0;display:flex;gap:0;margin:0;padding:0 clamp(14px,1.6vw,24px) clamp(14px,1.6vw,22px);list-style:none;background:linear-gradient(transparent,rgba(14,27,26,.78));counter-reset:b}
#kc .b2c li{flex:1;padding-top:12px;border-top:2px solid rgba(243,238,230,.28);color:rgba(243,238,230,.62);font:500 11px/1.2 var(--sans);letter-spacing:.22em;text-transform:uppercase;counter-increment:b;transition:color .4s,border-color .4s}
#kc .b2c li+li{margin-left:10px}
#kc .b2c li:before{content:"0" counter(b) " ";color:inherit;opacity:.7}
#kc .b2c li.on{color:#F3EEE6;border-color:var(--go,#C9A96E)}
#kc .b2n{margin-top:18px;font:italic 400 17px/1.5 var(--serif);color:inherit;opacity:.9}
#kc .b2n span{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;font-style:normal;opacity:.75}
#kc .ws .b2s-ws{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
#kc .ws .b2s-ws b{font-size:20px;margin:8px 0 4px}
#kc .ws .b2s-ws span{font-size:13px;color:inherit;opacity:.75}
#kc .b2h{padding:clamp(40px,5vh,72px) 0;background:var(--lin2,#ECE5DA)}
#kc .b2h .w{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(28px,4vw,72px);align-items:center}
#kc .b2h .b2v{aspect-ratio:4/5}
#kc .b2h h2{margin:14px 0 0}
#kc .b2h .b2c{display:none}
#kc .b2h .b2s li{opacity:.5;transition:opacity .5s,border-color .5s}
#kc .b2h .b2s li.on{opacity:1;border-top-color:var(--go,#C9A96E);box-shadow:inset 0 2px 0 var(--go,#C9A96E)}
#kc .b2h .b2s.nov li{opacity:1}
#kc .b2s{list-style:none;margin:clamp(20px,2.6vh,32px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,28px)}
#kc .b2s li{padding-top:16px;border-top:1px solid var(--go,#C9A96E)}
#kc .b2s i{display:block;font:italic 400 16px/1 var(--serif);color:var(--go,#C9A96E)}
#kc .b2s b{display:block;margin:10px 0 6px;font:400 24px/1.15 var(--serif)}
#kc .b2s span{display:block;font-size:14px;line-height:1.55;color:var(--mut)}
#kc .lng{margin-top:16px;font-size:13px;line-height:1.6;opacity:.85}
#kc .lng span{white-space:nowrap}
@media (max-width:760px){
#kc .b2h .w{grid-template-columns:1fr}
#kc .b2h{padding:36px 0}
#kc .b2h .b2v{display:none}
#kc .b2h h2{font-size:27px}
#kc .b2s{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
#kc .b2s li{padding-top:10px}
#kc .b2s b{font-size:19px;margin:6px 0 0}
#kc .b2s span{display:none}
#kc .b2c li{font-size:10px;letter-spacing:.16em}
#kc .ws .b2s-ws{grid-template-columns:repeat(4,minmax(0,1fr))}
#kc .b2n{font-size:15.5px}
}
</style>
<script>/* film: light up the step that is on screen; pause when off screen */
(function(){function run(){document.querySelectorAll('#kc .b2v').forEach(function(f){var v=f.querySelector('video'),li=f.querySelectorAll('.b2c li');if(!v||f.getAttribute('data-b2'))return;f.setAttribute('data-b2','1');
var sec=f.closest('.b2h'),st=sec?sec.querySelectorAll('.b2s li'):[];var cut=[5.8,7.85,9.75,99];v.addEventListener('timeupdate',function(){var t=v.currentTime,k=0;while(t>=cut[k])k++;for(var i=0;i<li.length;i++)li[i].classList.toggle('on',i===k);for(var j=0;j<st.length;j++)st[j].classList.toggle('on',j===k)});if(sec&&getComputedStyle(f).display==='none'){var o=sec.querySelector('.b2s');o&&o.classList.add('nov')}
if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause()})},{threshold:.2}).observe(f)}})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})();</script>
