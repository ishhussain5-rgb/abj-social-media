<!-- ABJ FORMSTEP (booking form: two short steps on phones, optional email + best time to call; 19 Nov 2026) -->
<style>/* Phones only for the steps; the two new optional fields show on every screen size.
   Undo: delete from the ABJ FORMSTEP marker to /ABJ FORMSTEP, remove the f-email/f-calltime block and the em/ct lines in the form script, publish. */
#kc .fs-next,#kc .fs-step{display:none}
@media (max-width:760px){
#kc form.fs-on .fs-step{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font:500 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
#kc form.fs-on:not(.fs-2) .fs-s2{display:none!important}
#kc form.fs-on:not(.fs-2) .fs-next{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:6px}
#kc form.fs-on.fs-2 .fs-s2.fs-first{scroll-margin-top:90px}
}
</style>
<script>(function(){function run(){
  var f=document.getElementById('abj-booking-form');if(!f||f.getAttribute('data-fs'))return;f.setAttribute('data-fs','1');
  var mq=window.matchMedia&&matchMedia('(max-width:760px)');
  var $=function(id){return document.getElementById(id)};
  var t=$('f-timing'),s2=[t&&t.closest('.g2'),$('f-email')&&$('f-email').closest('.g2'),$('abj-notes')&&$('abj-notes').closest('.f'),f.querySelector('.send')].filter(Boolean);
  if(s2.length<3)return;
  s2.forEach(function(el,i){el.classList.add('fs-s2');if(!i)el.classList.add('fs-first')});
  var step=document.createElement('div');step.className='fs-step';step.innerHTML='<span>Step <b class="fs-n">1</b> of 2</span><span class="fs-l">Your details</span>';
  var sub=f.querySelector('.sub');(sub||f.firstChild).parentNode.insertBefore(step,sub?sub.nextSibling:f.firstChild);
  var nx=document.createElement('button');nx.type='button';nx.className='bt d fs-next';nx.textContent='Next: two quick questions';
  s2[0].parentNode.insertBefore(nx,s2[0]);
  var PC=/\b([A-PR-UWYZ][A-HK-Y]?\d[A-Z\d]?\s*\d[ABD-HJLNP-UW-Z]{2})\b/i;
  nx.addEventListener('click',function(){
    var ok=true,first=null,bad=function(id){var e=$(id);if(!e)return;e.classList.add('err');ok=false;first=first||e};
    if(($('abj-name').value||'').trim().length<2)bad('f-name');
    if(!/^[\d\s+()-]{7,}$/.test(($('abj-phone').value||'').trim()))bad('f-phone');
    var a=($('abj-addr').value||'').trim();if(a.length<6||!PC.test(a))bad('f-addr');
    var ch=f.querySelectorAll('#abj-chips input:checked');if(!ch.length)bad('f-proj');
    if([].some.call(ch,function(i){return i.value==='Other'})&&($('abj-other').value||'').trim().length<2)bad('f-other');
    if(!ok){first.scrollIntoView({behavior:'smooth',block:'center'});return}
    f.classList.add('fs-2');step.querySelector('.fs-n').textContent='2';step.querySelector('.fs-l').textContent='Nearly done';
    s2[0].scrollIntoView({behavior:'smooth',block:'start'});var sel=$('abj-timing');sel&&setTimeout(function(){try{sel.focus({preventScroll:true})}catch(e){}},400);
  });
  var set=function(){f.classList.toggle('fs-on',!!(mq&&mq.matches))};set();mq&&mq.addEventListener&&mq.addEventListener('change',set);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})();</script>
<!-- /ABJ FORMSTEP -->
