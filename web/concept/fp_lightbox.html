<!-- featured project photos open in a viewer (12 Nov 2026, Ish) -->
<style>
#kc .fp figure{cursor:zoom-in}
#kc .fp figure img{transition:transform .6s ease}
#kc .fp figure:hover img{transform:scale(1.03)}
#kc .fp figure:focus-visible{outline:2px solid #C9A96E;outline-offset:3px}
.abj-lb{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:rgba(14,27,26,.9);padding:24px}
.abj-lb.op{display:flex}
.abj-lb figure{margin:0;display:flex;flex-direction:column;align-items:center;max-width:min(92vw,1100px)}
.abj-lb img{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.abj-lb figcaption{margin-top:16px;font-size:11px;line-height:1.5;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#F3EEE6;text-align:center}
.abj-lb button{position:absolute;width:48px;height:48px;border:1px solid rgba(243,238,230,.35);border-radius:50%;background:rgba(14,27,26,.6);color:#F3EEE6;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.abj-lb button:hover,.abj-lb button:focus-visible{border-color:#C9A96E;color:#C9A96E;outline:none}
.abj-lb .x{top:20px;right:20px}
.abj-lb .pv{left:20px;top:50%;transform:translateY(-50%)}
.abj-lb .nx{right:20px;top:50%;transform:translateY(-50%)}
@media (max-width:760px){.abj-lb .pv,.abj-lb .nx{top:auto;bottom:20px;transform:none}.abj-lb img{max-height:calc(100vh - 190px)}}
</style>
<script>
(function () {
  var root = document.querySelector('#kc .fp');
  if (!root || root.__abjLb) return; root.__abjLb = 1;
  var figs = [].slice.call(root.querySelectorAll('figure')).filter(function (f) { return f.querySelector('img'); });
  if (!figs.length) return;
  var lb = document.createElement('div');
  lb.className = 'abj-lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Photo viewer');
  lb.innerHTML = '<figure><img alt=""><figcaption></figcaption></figure>' +
    '<button class="x" type="button" aria-label="Close">&times;</button>' +
    '<button class="pv" type="button" aria-label="Previous photo">&lsaquo;</button>' +
    '<button class="nx" type="button" aria-label="Next photo">&rsaquo;</button>';
  document.body.appendChild(lb);
  var k = document.querySelector('#kc .kick'); if (k) lb.style.fontFamily = getComputedStyle(k).fontFamily;
  var im = lb.querySelector('img'), cap = lb.querySelector('figcaption'), btns = [].slice.call(lb.querySelectorAll('button')), cur = 0, last = null;
  function show(i) {
    cur = (i + figs.length) % figs.length;
    var s = figs[cur].querySelector('img'), fc = figs[cur].querySelector('figcaption');
    im.src = s.currentSrc || s.src; im.alt = s.alt || '';
    cap.textContent = (fc ? fc.textContent : '') + (fc ? '  ·  ' : '') + (cur + 1) + ' / ' + figs.length;
  }
  function open(i) { last = document.activeElement; show(i); lb.classList.add('op'); document.documentElement.style.overflow = 'hidden'; btns[0].focus(); }
  function close() { lb.classList.remove('op'); document.documentElement.style.overflow = ''; if (last && last.focus) last.focus(); }
  figs.forEach(function (f, i) {
    f.setAttribute('tabindex', '0'); f.setAttribute('role', 'button');
    f.setAttribute('aria-label', 'View larger photo: ' + (f.querySelector('img').alt || ''));
    f.addEventListener('click', function () { open(i); });
    f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
  });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target === lb.firstChild) close(); });
  btns[0].addEventListener('click', close);
  btns[1].addEventListener('click', function () { show(cur - 1); });
  btns[2].addEventListener('click', function () { show(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('op')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'Tab') { e.preventDefault(); var j = btns.indexOf(document.activeElement); btns[(j + (e.shiftKey ? -1 : 1) + btns.length) % btns.length].focus(); }
  });
})();
</script>
